# Identifica o backend
spring.application.name=point-media
# Restringe o servidor ao desenvolvimento local
server.address=127.0.0.1
server.port=8080
# Impede execução automática de SQL
spring.sql.init.mode=never
# Recusa campos que não pertencem ao pedido
spring.jackson.deserialization.fail-on-unknown-properties=true
# Limita a duração inativa da sessão e usa somente cookies
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
# Protege o cookie contra leitura por JavaScript
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Exige Secure quando o ambiente usar HTTPS
server.servlet.session.cookie.secure=${POINT_MEDIA_COOKIE_SECURE:false}
# Limita formulários sem substituir um limite de JSON
server.tomcat.max-http-form-post-size=8KB
# Oculta detalhes internos nas respostas de erro
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

#---
spring.config.activate.on-profile=!mysql
# Mantém a execução sem banco fora do profile MySQL
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
