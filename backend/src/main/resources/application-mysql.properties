spring.datasource.url=jdbc:mysql://127.0.0.1:${POINT_MEDIA_DB_PORT:3306}/point_media_dev?sslMode=REQUIRED&connectTimeout=3000&socketTimeout=3000&connectionTimeZone=UTC
spring.datasource.username=${POINT_MEDIA_DB_USER}
spring.datasource.password=${POINT_MEDIA_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.validation-timeout=1000
spring.datasource.hikari.initialization-fail-timeout=3000
spring.datasource.hikari.read-only=true
spring.jdbc.template.query-timeout=3s
